name: Tes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    name: Tes (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, gd, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  mysql:
    name: Migrasi & tes (MySQL 8)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: almara_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: almara_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: mbstring, pdo_mysql, gd, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force && php artisan db:seed --force
      - run: php artisan test --env=testing
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: almara_test
