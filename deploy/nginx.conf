# Contoh blok server Nginx (Ubuntu 24.04). Sesuaikan domain dan path.
server {
    listen 80;
    server_name contoh-domain.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name contoh-domain.id;
    root /var/www/almara/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/contoh-domain.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contoh-domain.id/privkey.pem;

    client_max_body_size 10m;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Service worker harus selalu segar.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
