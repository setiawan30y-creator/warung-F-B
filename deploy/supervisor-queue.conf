; Supervisor untuk antrean Laravel (Blueprint §3.1). Salin ke /etc/supervisor/conf.d/
[program:almara-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/almara/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/almara/storage/logs/queue.log
stopwaitsecs=3600
